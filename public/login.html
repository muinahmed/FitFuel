<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – FitFuel</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/img/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="container container--narrow auth">
    <a href="/index.html"><img class="auth-logo" src="/img/logo.png" alt="FitFuel home" width="80" height="80"></a>
    <div class="card">
      <h1>Welcome back</h1>
      <div id="form-message" class="message" role="alert"></div>
      <form id="login-form">
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--block">Log in</button>
      </form>
      <p class="auth-switch">New to FitFuel? <a href="/signup.html">Create an account</a></p>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
