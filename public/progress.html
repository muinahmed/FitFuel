<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress – FitFuel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main" class="container">
    <h1>Progress</h1>
    <div id="page-message" class="message" role="alert"></div>
    <section class="stat-tiles" id="progress-stats" aria-label="Summary"></section>

    <div class="grid grid--progress">
      <section class="card" aria-labelledby="log-heading">
        <h2 id="log-heading">Log your weight</h2>
        <div id="log-message" class="message" role="status"></div>
        <form id="weight-form">
          <div class="form-field">
            <label for="logDate">Date</label>
            <input id="logDate" name="logDate" type="date" required>
          </div>
          <div class="form-field">
            <label for="weightKg">Weight</label>
            <div class="input-with-unit">
              <input id="weightKg" name="weightKg" type="number" min="20" max="400" step="0.1" inputmode="decimal" required>
              <span>kg</span>
            </div>
            <p class="hint">Weigh yourself once a week, at the same time of day.</p>
          </div>
          <button type="submit" class="btn">Add weight</button>
        </form>
      </section>

      <section class="card" aria-labelledby="weight-chart-heading">
        <h2 id="weight-chart-heading">Weight over time</h2>
        <p id="weight-summary" class="muted"></p>
        <div class="chart" id="weight-chart">
          <canvas role="img" aria-label="Line chart of your weight over time"></canvas>
        </div>
      </section>
    </div>

    <section class="card section-heading" aria-labelledby="workout-chart-heading">
      <h2 id="workout-chart-heading">Workouts per week</h2>
      <p id="workout-summary" class="muted"></p>
      <div class="chart" id="workout-chart">
        <canvas role="img" aria-label="Bar chart of completed workouts per week"></canvas>
      </div>
      <details class="chart-table">
        <summary>Show as a table</summary>
        <table class="data-table">
          <thead><tr><th scope="col">Week starting</th><th scope="col">Workouts</th></tr></thead>
          <tbody id="workout-table"></tbody>
        </table>
      </details>
    </section>

    <section class="card section-heading" aria-labelledby="entries-heading">
      <h2 id="entries-heading">Your weight entries</h2>
      <div id="entries-message" class="message" role="status"></div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th scope="col">Date</th><th scope="col">Weight</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
          <tbody id="weight-table"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/progress.js"></script>
</body>
</html>
