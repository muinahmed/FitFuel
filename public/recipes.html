<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes – FitFuel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main" class="container">
    <div class="page-heading">
      <h1>Recipes</h1>
      <div class="button-row">
        <a class="btn btn--secondary" href="/favourites.html"><span aria-hidden="true">♥</span> Your favourites</a>
        <a class="btn btn--secondary" href="/mealplan.html">Back to meal plan</a>
      </div>
    </div>

    <form id="recipe-filters" class="filter-bar" role="search">
      <div class="form-field">
        <label for="search">Search by name</label>
        <input id="search" name="search" type="search" maxlength="80" placeholder="e.g. curry">
      </div>
      <div class="form-field">
        <label for="mealType">Meal type</label>
        <select id="mealType" name="mealType">
          <option value="">All meals</option>
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="snack">Snack</option>
        </select>
      </div>
      <div class="form-field">
        <label for="diet">Diet</label>
        <select id="diet" name="diet">
          <option value="">All diets</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="halal">Halal</option>
        </select>
      </div>
    </form>

    <div id="page-message" class="message" role="alert"></div>
    <p id="result-count" class="muted" aria-live="polite"></p>
    <div id="recipe-grid" class="recipe-grid"></div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/recipeDetail.js"></script>
  <script src="/js/recipes.js"></script>
</body>
</html>
