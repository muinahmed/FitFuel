<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meal plan – FitFuel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main" class="container">
    <div class="page-heading">
      <div>
        <h1>Meal plan</h1>
        <p class="muted" id="week-label"></p>
      </div>
      <div class="button-row">
        <button type="button" class="btn" id="generate-button">Generate plan</button>
        <a class="btn btn--secondary" href="/recipes.html">Browse recipes</a>
      </div>
    </div>

    <div id="week-toggle"></div>
    <div id="page-message" class="message" role="alert"></div>

    <section class="card plan-summary" aria-labelledby="summary-heading">
      <h2 id="summary-heading" class="visually-hidden">Cost this week</h2>
      <div id="cost-summary" class="plan-summary__cost"><p class="muted">Loading your plan…</p></div>
      <a class="btn btn--secondary" href="/shopping.html" id="shopping-link" hidden><span data-icon="cart"></span>Shopping list</a>
    </section>

    <div id="plan-grid" class="plan-grid"></div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/recipeDetail.js"></script>
  <script src="/js/weekToggle.js"></script>
  <script src="/js/mealplan.js"></script>
</body>
</html>
