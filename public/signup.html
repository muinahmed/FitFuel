<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up – FitFuel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="container container--narrow auth">
    <a href="/index.html"><img class="auth-logo" src="/img/logo.png" alt="FitFuel home" width="80" height="80"></a>
    <div class="card">
      <h1>Create your account</h1>
      <div id="form-message" class="message" role="alert"></div>
      <form id="signup-form">
        <div class="form-field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" maxlength="50" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" maxlength="100" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="8" autocomplete="new-password"
                 aria-describedby="password-hint" required>
          <p id="password-hint" class="hint">At least 8 characters.</p>
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn--block">Sign up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
