<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping list – FitFuel</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/img/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main" class="container container--medium">
    <div class="page-heading">
      <div>
        <h1>Shopping list</h1>
        <p class="muted" id="week-label"></p>
      </div>
      <a class="btn btn--secondary" href="/mealplan.html" id="plan-link">Back to meal plan</a>
    </div>

    <div id="week-toggle"></div>
    <div id="page-message" class="message" role="alert"></div>

    <div class="receipt-shadow">
      <section class="card receipt">
        <div class="shopping-head">
          <p id="total-cost" class="shopping-total" hidden></p>
          <p id="progress-text" class="muted" aria-live="polite">Loading your shopping list…</p>
          <div class="progress-bar" id="progress-bar" aria-hidden="true" hidden><div class="progress-bar__fill" id="progress-fill"></div></div>
        </div>
        <ul id="shopping-list" class="shopping-list"></ul>
      </section>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/weekToggle.js"></script>
  <script src="/js/shopping.js"></script>
</body>
</html>
