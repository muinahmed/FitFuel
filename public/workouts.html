<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workouts – FitFuel</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/img/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main" class="container">
    <div class="page-heading">
      <div>
        <h1>Workouts</h1>
        <p class="muted" id="goal-label"></p>
      </div>
      <a class="btn btn--secondary" href="/progress.html"><span data-icon="chart"></span>See your progress</a>
    </div>

    <div id="page-message" class="message" role="status"></div>

    <section class="card week-progress" aria-labelledby="days-heading">
      <div class="week-progress__status">
        <h2 id="days-heading">Your training week</h2>
        <p class="muted" id="week-status"><span class="skeleton__line" aria-hidden="true"></span><span class="visually-hidden">Loading your plan…</span></p>
        <div class="progress-bar" id="week-bar" aria-hidden="true" hidden><div class="progress-bar__fill" id="week-fill"></div></div>
      </div>
      <form id="days-form" class="inline-form">
        <div class="form-field">
          <label for="trainingDays">Training days per week</label>
          <select id="trainingDays" name="trainingDays" required>
            <option value="">Choose…</option>
            <option value="2">2 days</option>
            <option value="3">3 days</option>
            <option value="4">4 days</option>
            <option value="5">5 days</option>
          </select>
        </div>
        <button type="submit" class="btn">Save</button>
      </form>
    </section>

    <h2 class="section-heading">This week's plan</h2>
    <div id="sessions" class="session-list" data-skeleton="card 3"></div>

    <section class="card section-heading" aria-labelledby="history-heading">
      <h2 id="history-heading">Workout history</h2>
      <ul id="history" class="history-list" data-skeleton="row 4"></ul>
    </section>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/workouts.js"></script>
</body>
</html>
