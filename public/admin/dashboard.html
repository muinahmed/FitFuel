<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard – FitFuel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-area="admin">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main" class="container">
    <h1>Admin dashboard</h1>
    <div id="page-message" class="message" role="alert"></div>

    <div class="grid grid--3">
      <section class="card admin-card" aria-labelledby="users-heading">
        <div class="admin-card__head"><span class="icon-chip" data-icon="users"></span><h2 id="users-heading">Users</h2></div>
        <div class="stat-row" id="user-stats"><p class="muted">Loading…</p></div>
        <a class="btn" href="/admin/users.html">Manage users</a>
      </section>
      <section class="card admin-card" aria-labelledby="recipes-heading">
        <div class="admin-card__head"><span class="icon-chip" data-icon="book"></span><h2 id="recipes-heading">Recipes</h2></div>
        <div id="recipe-stats"><p class="muted">Loading…</p></div>
        <a class="btn" href="/admin/recipes.html">Manage recipes</a>
      </section>
      <section class="card admin-card" aria-labelledby="workouts-heading">
        <div class="admin-card__head"><span class="icon-chip" data-icon="dumbbell"></span><h2 id="workouts-heading">Workouts</h2></div>
        <div id="workout-stats"><p class="muted">Loading…</p></div>
        <a class="btn" href="/admin/workouts.html">Manage workouts</a>
      </section>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/admin/dashboard.js"></script>
</body>
</html>
